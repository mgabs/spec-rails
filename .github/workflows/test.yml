name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.16.0

      - name: Lint shell scripts with ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './bin ./tests'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Pre-Commit & Run Hooks
        env:
          # The dedicated rails workflow covers CLI checks; the later test step covers lint and tests.
          SKIP: ${{ github.event_name == 'push' && 'branch-protection,spec-rails-check,spec-rails-verify,lint,test' || 'build-cli,spec-rails-check,spec-rails-verify,lint,test' }}
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Run Test Suite
        run: make test
