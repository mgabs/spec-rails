name: Spec-Rails Rails

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rails:
    name: Testing Rails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare local Spec-Rails CLI
        run: |
          if [ -f package.json ] && grep -q '"name": "spec-rails"' package.json; then
            npm ci
            npm run build
          fi

      - name: Pre-Commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
