# Spec-Rails Mutation Testing Rail for Rust (cargo-mutants)
# Target: >= 95% mutation kill score on domain logic. Every surviving mutant must be justified in the PR.

test_tool = "nextest"
timeout_multiplier = 3.0
minimum_test_timeout = 20

