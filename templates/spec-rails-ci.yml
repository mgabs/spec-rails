name: Spec-Rails Rails

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify-rails:
    name: Verify Specs & Testing Rails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate & Lane Check (with Spec Audit)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          npm install -g @fission-ai/openspec@1.16.0
          npx spec-rails check --audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Verify Test Rails
        run: |
          npx spec-rails verify

      - name: Pre-Commit
        run: |
          # Skip hooks already covered by the check/verify steps above.
          SKIP=$(grep -oE 'id: (branch-protection|spec-rails-check|test)$' .pre-commit-config.yaml | sed 's/id: //' | paste -sd, -)
          export SKIP
          pip install pre-commit
          pre-commit run --all-files
